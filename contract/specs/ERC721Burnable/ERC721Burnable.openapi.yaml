# file: docs/contract/specs/ERC721Burnable/ERC721Burnable.openapi.yaml

openapi: 3.0.3
info:
  title: "ERC721Burnable Solidity Interface"
  version: "1.0.0"
  description: |
    ERC721Burnable コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、NFTを焼却(破棄)できる機能を提供するERC721の拡張です。
    トークンの所有者または承認されたオペレーターがburn関数を呼び出すことができます。

    このコントラクトは以下のコントラクトを継承しています:
    - Context
    - ERC721

tags:
  - name: 書き込み関数

x-tagGroups:
  - name: 関数
    tags:
      - 書き込み関数

paths:
  /burn:
    post:
      summary: "burn"
      description: |
        指定されたtokenIdを焼却(破棄)します。

        呼び出し元は、tokenIdの所有者または承認されたオペレーターである必要があります。
        焼却されたトークンは完全に削除され、復元できません。
      operationId: burn
      tags:
        - 書き込み関数
      parameters:
        - name: tokenId
          in: query
          required: true
          schema:
            type: string
          description: "焼却するトークンIDを指定します。uint256型の数値を文字列で表現します。呼び出し元が所有または承認されている必要があります。"
          example: "1"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "トランザクションが成功した場合、空の応答を返します。"
                    example: ""
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC721InsufficientApproval: 呼び出し元が所有者でも承認されたオペレーターでもない場合<br>・ERC721NonexistentToken: tokenIdが存在しない場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC721InsufficientApproval:
                  summary: 承認不足
                  value:
                    error: ERC721InsufficientApproval
                    message: "ERC-721: caller is not token owner or approved"
                    details: "Caller must own or be approved for the token"
                ERC721NonexistentToken:
                  summary: 存在しないトークン
                  value:
                    error: ERC721NonexistentToken
                    message: "ERC-721: invalid token ID"
                    details: "Token ID does not exist"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "コントラクト呼び出し時のエラー情報を表現する共通スキーマです。"
      properties:
        message:
          type: string
          description: "カスタムエラー名または `revert` / `require` のメッセージ文字列をそのまま格納します。"
        data:
          type: object
          description: "追加情報(任意)です。"
