# file: docs/contract/specs/ERC721Pausable/ERC721Pausable.openapi.yaml

openapi: 3.0.3
info:
  title: "ERC721Pausable Solidity Interface"
  version: "1.0.0"
  description: |
    ERC721Pausable コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、NFTの転送を一時停止できる機能を提供するERC721の拡張です。
    一時停止中は、トークンの転送、鋳造、焼却が実行できません。

    このコントラクトは以下のコントラクトを継承しています:
    - ERC721
    - Pausable

tags:
  - name: 読み取り関数

x-tagGroups:
  - name: 関数
    tags:
      - 読み取り関数

paths:
  /paused:
    get:
      summary: "paused"
      description: |
        コントラクトが一時停止状態かどうかを確認します。

        一時停止状態の場合、NFTの転送、鋳造、焼却が実行できません。
      operationId: paused
      tags:
        - 読み取り関数
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "一時停止中の場合true、そうでない場合falseを返します。"
                    example: "false"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "コントラクト呼び出し時のエラー情報を表現する共通スキーマです。"
      properties:
        message:
          type: string
          description: "カスタムエラー名または `revert` / `require` のメッセージ文字列をそのまま格納します。"
        data:
          type: object
          description: "追加情報(任意)です。"
