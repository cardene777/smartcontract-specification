      tags:
        - 書き込み関数
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "送金先のアドレスを指定します。ゼロアドレスは指定できません。"
          example: "0x1234567890123456789012345678901234567890"
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: "転送するトークン量を指定します。uint256型の数値を文字列で表現します。"
          example: "1000000000000000000"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
