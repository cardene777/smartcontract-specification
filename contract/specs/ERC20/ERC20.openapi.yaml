          description: "この関数で発生しうるエラーの一覧です。<br>・ERC20InvalidSender: 送信者がゼロアドレスの場合<br>・ERC20InvalidReceiver: 受信者がゼロアドレスの場合<br>・ERC20InsufficientBalance: 送信者の残高が不足している場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC20InvalidSender:
                  summary: 送信者がゼロアドレス
                  value:
