paths:
  /allowance:
    get:
      summary: "allowance"
      description: |
        spenderがownerから使用を許可されているトークン量を取得します。
        
        ERC20標準関数です。
      operationId: allowance
      tags:
        - Mapping
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "所有者のアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
        - name: spender
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンの使用を許可するアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "許可された残高を返します。"
                    example: "1000000000000000000"

  /approve:
    post:
      summary: "approve"
      description: |
        spenderが指定された量のトークンを使用することを承認します。

        ERC20標準関数です。
      operationId: approve
      tags:
        - 書き込み関数
      parameters:
        - name: spender
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンの使用を許可するアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: "承認するトークン量を指定します。uint256型の数値を文字列で表現します。"
          example: "1000000000000000000"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "承認が成功した場合trueを返します。"
                    example: "true"
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC20InvalidApprover: 承認者がゼロアドレスの場合<br>・ERC20InvalidSpender: spenderがゼロアドレスの場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC20InvalidApprover:
                  summary: 承認者がゼロアドレス
                  value:
                    error: ERC20InvalidApprover
                    message: "ERC-20: approve from the zero address"
                    details: "Approver cannot be the zero address"
                ERC20InvalidSpender:
                  summary: 無効なspender
                  value:
                    error: ERC20InvalidSpender
                    message: "ERC-20: approve to the zero address"
                    details: "Spender cannot be the zero address"

