                    message: "ERC-20: transfer from the zero address"
                    details: "Sender cannot be the zero address"
                ERC20InvalidReceiver:
                  summary: 受信者がゼロアドレス
                  value:
                    error: ERC20InvalidReceiver
                    message: "ERC-20: transfer to the zero address"
                    details: "Receiver cannot be the zero address"
                ERC20InsufficientBalance:
