components:
  schemas:
    ErrorResponse:
      type: object
      description: "コントラクト呼び出し時のエラー情報を表現する共通スキーマです。"
      properties:
        message:
          type: string
          description: "カスタムエラー名または `revert` / `require` のメッセージ文字列をそのまま格納します。"
        data:
          type: object
          description: "追加情報（任意）です。"

    ApprovalEvent:
      type: object
      description: "Approval"
      properties:
        owner:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: "インデックス付き。所有者のアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
        approved:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: "インデックス付き。承認状態を指定します。"
          example: "0x1234567890123456789012345678901234567890"
        tokenId:
          type: string
          description: "インデックス付き。tokenIdを指定します。"
          example: "1000000000000000000"

    ApprovalForAllEvent:
      type: object
      description: "ApprovalForAll"
      properties:
        owner:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: "インデックス付き。所有者のアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
        operator:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: "インデックス付き。オペレーターのアドレスを指定します。"
