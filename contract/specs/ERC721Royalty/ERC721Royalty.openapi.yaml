# file: docs/contract/specs/ERC721Royalty/ERC721Royalty.openapi.yaml

openapi: 3.0.3
info:
  title: "ERC721Royalty Solidity Interface"
  version: "1.0.0"
  description: |
    ERC721Royalty コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、ERC-2981 NFTロイヤリティ標準を実装したERC721の拡張です。
    NFTの二次販売時のロイヤリティ支払い情報を取得する標準化された方法を提供します。

    ロイヤリティ情報は、ERC2981._setDefaultRoyaltyですべてのトークンIDに対してグローバルに設定でき、
    ERC2981._setTokenRoyaltyで個別のトークンIDに対して設定することもできます。
    個別設定はグローバル設定よりも優先されます。

    重要: ERC-2981はロイヤリティ情報を通知する方法を規定するのみで、支払いを強制しません。
    マーケットプレイスは、販売時に自発的にロイヤリティを支払うことが期待されています。

    このコントラクトは以下のコントラクトを継承しています:
    - ERC2981
    - ERC721

tags:
  - name: 読み取り関数

x-tagGroups:
  - name: 関数
    tags:
      - 読み取り関数

paths:
  /royaltyInfo:
    get:
      summary: "royaltyInfo"
      description: |
        指定されたtokenIdと販売価格に基づいて、ロイヤリティ情報を取得します。

        ERC2981標準関数です。ロイヤリティの受取人アドレスとロイヤリティ額を返します。
        個別のトークンロイヤリティが設定されている場合はそれが、なければデフォルトロイヤリティが使用されます。
      operationId: royaltyInfo
      tags:
        - 読み取り関数
      parameters:
        - name: tokenId
          in: query
          required: true
          schema:
            type: string
          description: "ロイヤリティ情報を確認するトークンIDを指定します。uint256型の数値を文字列で表現します。"
          example: "1"
        - name: salePrice
          in: query
          required: true
          schema:
            type: string
          description: "NFTの販売価格を指定します。uint256型の数値を文字列で表現します。この価格に基づいてロイヤリティ額が計算されます。"
          example: "1000000000000000000"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiver:
                    type: string
                    pattern: "^0x[0-9a-fA-F]{40}$"
                    description: "ロイヤリティを受け取るアドレスを返します。"
                    example: "0x1234567890123456789012345678901234567890"
                  royaltyAmount:
                    type: string
                    description: "ロイヤリティの金額を返します。salePriceに基づいて計算されます。"
                    example: "50000000000000000"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "コントラクト呼び出し時のエラー情報を表現する共通スキーマです。"
      properties:
        message:
          type: string
          description: "カスタムエラー名または `revert` / `require` のメッセージ文字列をそのまま格納します。"
        data:
          type: object
          description: "追加情報(任意)です。"
