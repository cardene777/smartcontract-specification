# file: docs/contract/specs/ERC721Enumerable/ERC721Enumerable.openapi.yaml

openapi: 3.0.3
info:
  title: "ERC721Enumerable Solidity Interface"
  version: "1.0.0"
  description: |
    ERC721Enumerable コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、コントラクト内のすべてのトークンIDおよび各アカウントが所有する
    すべてのトークンIDを列挙できる機能を提供するERC721の拡張です。

    注意: ERC721ConsecutiveのようなカスタムbalanceOfロジックを実装するERC721拡張は、
    列挙機能と干渉するため、ERC721Enumerableと一緒に使用すべきではありません。

    このコントラクトは以下のコントラクトを継承しています:
    - ERC721
    - IERC721Enumerable

tags:
  - name: 読み取り関数
  - name: エラー

x-tagGroups:
  - name: 関数
    tags:
      - 読み取り関数
  - name: エラー
    tags:
      - エラー

paths:
  /tokenOfOwnerByIndex:
    get:
      summary: "tokenOfOwnerByIndex"
      description: |
        指定されたownerが所有する、指定されたindexのトークンIDを取得します。

        ownerが所有するトークンのリストから、index番目のトークンIDを返します。
        indexがbalanceOf(owner)以上の場合はエラーになります。
      operationId: tokenOfOwnerByIndex
      tags:
        - 読み取り関数
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンの所有者アドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
        - name: index
          in: query
          required: true
          schema:
            type: string
          description: "取得するトークンのインデックスを指定します。uint256型の数値を文字列で表現します。0から始まり、balanceOf(owner)-1までの値が有効です。"
          example: "0"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "指定されたインデックスのトークンIDを返します。"
                    example: "42"
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC721OutOfBoundsIndex: indexがbalanceOf(owner)以上の場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC721OutOfBoundsIndex:
                  summary: インデックス範囲外
                  value:
                    error: ERC721OutOfBoundsIndex
                    message: "ERC-721: owner index out of bounds"
                    details: "Index: 10, Balance: 5"

  /totalSupply:
    get:
      summary: "totalSupply"
      description: |
        コントラクト内の総トークン数を取得します。

        焼却されたトークンは含まれません。現在存在するすべてのトークンの総数です。
      operationId: totalSupply
      tags:
        - 読み取り関数
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "総トークン数を返します。"
                    example: "10000"

  /tokenByIndex:
    get:
      summary: "tokenByIndex"
      description: |
        グローバルインデックスから、指定されたindexのトークンIDを取得します。

        コントラクト内のすべてのトークンから、index番目のトークンIDを返します。
        indexがtotalSupply()以上の場合はエラーになります。
      operationId: tokenByIndex
      tags:
        - 読み取り関数
      parameters:
        - name: index
          in: query
          required: true
          schema:
            type: string
          description: "取得するトークンのグローバルインデックスを指定します。uint256型の数値を文字列で表現します。0から始まり、totalSupply()-1までの値が有効です。"
          example: "0"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "指定されたインデックスのトークンIDを返します。"
                    example: "1"
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC721OutOfBoundsIndex: indexがtotalSupply()以上の場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC721OutOfBoundsIndex:
                  summary: インデックス範囲外
                  value:
                    error: ERC721OutOfBoundsIndex
                    message: "ERC-721: global index out of bounds"
                    details: "Index: 15000, Total supply: 10000"

  /errors/ERC721OutOfBoundsIndex:
    get:
      summary: "ERC721OutOfBoundsIndex"
      description: |
        インデックスが範囲外の時に返されるエラーです。

        tokenOfOwnerByIndexまたはtokenByIndex関数で、指定されたindexが有効範囲を超えている場合に発生します。
        ownerがゼロアドレスの場合、グローバルインデックスの範囲外を示します。

        **パラメータ:**
        - `owner` (address): トークンの所有者(グローバルインデックスの場合はゼロアドレス)
        - `index` (uint256): 範囲外のインデックス
      operationId: error_ERC721OutOfBoundsIndex
      tags:
        - エラー
      responses:
        "200":
          description: "インデックスが範囲外の時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC721OutOfBoundsIndex"
                  parameters:
                    type: object
                    properties:
                      owner:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "トークンの所有者を指定します。"
                      index:
                        type: string
                        description: "範囲外のインデックスを指定します。"

  /errors/ERC721EnumerableForbiddenBatchMint:
    get:
      summary: "ERC721EnumerableForbiddenBatchMint"
      description: |
        バッチミントが試みられた時に返されるエラーです。

        ERC721Enumerableでは、バッチミント(複数トークンの同時鋳造)はサポートされていません。
      operationId: error_ERC721EnumerableForbiddenBatchMint
      tags:
        - エラー
      responses:
        "200":
          description: "バッチミントが試みられた時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC721EnumerableForbiddenBatchMint"

components:
  schemas:
    ErrorResponse:
      type: object
      description: "コントラクト呼び出し時のエラー情報を表現する共通スキーマです。"
      properties:
        message:
          type: string
          description: "カスタムエラー名または `revert` / `require` のメッセージ文字列をそのまま格納します。"
        data:
          type: object
          description: "追加情報(任意)です。"
