info:
  title: "ERC20Burnable Solidity Interface"
  version: "1.0.0"
  description: |
    ERC20Burnable コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、トークン保有者が自身のトークンや承認されたトークンを焼却(破棄)できる機能を提供します。
    焼却されたトークンは総供給量から削減され、オフチェーンでもイベント分析により追跡可能です。

    このコントラクトは以下のコントラクトを継承しています:
    - Context
    - ERC20

tags:
  - name: 書き込み関数
    description: ステートを変更する関数。
  - name: イベント
  - name: エラー

