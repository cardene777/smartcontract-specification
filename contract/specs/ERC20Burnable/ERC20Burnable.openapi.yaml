paths:
  /burn:
    post:
      summary: "burn"
      description: |
        呼び出し元のアカウントから指定された量のトークンを焼却します。

        焼却されたトークンは完全に破棄され、総供給量から減少します。この操作は取り消すことができません。
        焼却によりTransferイベント(toがゼロアドレス)が発行され、オフチェーンで追跡可能です。
      operationId: burn
      tags:
        - 書き込み関数
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: "焼却するトークン量を指定します。uint256型の数値を文字列で表現します。呼び出し元の残高以下である必要があります。"
          example: "1000000000000000000"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "トランザクションが成功した場合、空の応答を返します。"
                    example: ""
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC20InvalidSender: 送信者がゼロアドレスの場合<br>・ERC20InsufficientBalance: 呼び出し元の残高が不足している場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC20InvalidSender:
                  summary: 送信者がゼロアドレス
                  value:
                    error: ERC20InvalidSender
                    message: "ERC-20: burn from the zero address"
                    details: "Cannot burn tokens from the zero address"
                ERC20InsufficientBalance:
                  summary: 残高不足
                  value:
                    error: ERC20InsufficientBalance
                    message: "ERC-20: burn amount exceeds balance"
                    details: "Burn amount: 100, Available balance: 50"

  /burnFrom:
    post:
      summary: "burnFrom"
      description: |
        指定されたアカウントから呼び出し元が承認された量のトークンを焼却します。

        この関数を実行するには、呼び出し元が事前にaccountから十分なallowanceを得ている必要があります。
        焼却時にallowanceから該当量が差し引かれ、accountの残高から指定量が削減されます。
        焼却によりTransferイベント(toがゼロアドレス)が発行されます。
      operationId: burnFrom
      tags:
        - 書き込み関数
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンを焼却する対象アカウントのアドレスを指定します。ゼロアドレスは指定できません。"
          example: "0x1234567890123456789012345678901234567890"
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: "焼却するトークン量を指定します。uint256型の数値を文字列で表現します。呼び出し元のallowance以下かつaccountの残高以下である必要があります。"
          example: "1000000000000000000"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "トランザクションが成功した場合、空の応答を返します。"
                    example: ""
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC20InvalidSender: accountがゼロアドレスの場合<br>・ERC20InsufficientBalance: accountの残高が不足している場合<br>・ERC20InsufficientAllowance: 呼び出し元のallowanceが不足している場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC20InvalidSender:
                  summary: accountがゼロアドレス
                  value:
                    error: ERC20InvalidSender
                    message: "ERC-20: burn from the zero address"
                    details: "Cannot burn tokens from the zero address"
                ERC20InsufficientBalance:
                  summary: 残高不足
                  value:
                    error: ERC20InsufficientBalance
                    message: "ERC-20: burn amount exceeds balance"
                    details: "Burn amount: 100, Available balance: 50"
                ERC20InsufficientAllowance:
                  summary: allowance不足
                  value:
                    error: ERC20InsufficientAllowance
                    message: "ERC-20: insufficient allowance"
                    details: "Required: 100, Allowance: 50"

  /events/Transfer:
    get:
      summary: "Transfer"
      description: |
        トークンが転送または焼却された時に発行されるイベントです。

        焼却の場合、toパラメータはゼロアドレス(0x0000000000000000000000000000000000000000)になります。

        **パラメータ:**
        - `from` (address) - indexed: 焼却元のアドレス
        - `to` (address) - indexed: ゼロアドレス(焼却の場合)
        - `value` (uint256): 焼却されたトークン量
      operationId: event_Transfer
      tags:
        - イベント
      responses:
        "200":
          description: "トークンが焼却された時に発行されるイベントです。toがゼロアドレスの場合、焼却を示します。"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferEvent'

  /errors/ERC20InsufficientAllowance:
    get:
      summary: "ERC20InsufficientAllowance"
      description: |
        allowanceが不足している時に返されるエラーです。

        burnFrom関数で、呼び出し元が保有するallowanceが焼却量に満たない場合に発生します。

        **パラメータ:**
        - `spender` (address): 呼び出し元のアドレス
        - `allowance` (uint256): 現在のallowance
        - `needed` (uint256): 必要なallowance
      operationId: error_ERC20InsufficientAllowance
      tags:
        - エラー
      responses:
        "200":
          description: "allowanceが不足している時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC20InsufficientAllowance"
                  parameters:
                    type: object
                    properties:
                      spender:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "呼び出し元のアドレスを指定します。"
                      allowance:
                        type: string
                        description: "現在のallowanceを指定します。"
                      needed:
                        type: string
                        description: "必要なallowanceを指定します。"

  /errors/ERC20InsufficientBalance:
    get:
      summary: "ERC20InsufficientBalance"
      description: |
        残高が不足している時に返されるエラーです。

        burn関数またはburnFrom関数で、焼却対象アカウントの残高が焼却量に満たない場合に発生します。

        **パラメータ:**
        - `sender` (address): 焼却対象アカウントのアドレス
        - `balance` (uint256): 現在の残高
        - `needed` (uint256): 必要な残高
      operationId: error_ERC20InsufficientBalance
      tags:
        - エラー
      responses:
        "200":
          description: "残高が不足している時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC20InsufficientBalance"
                  parameters:
                    type: object
                    properties:
                      sender:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "焼却対象アカウントのアドレスを指定します。"
                      balance:
                        type: string
                        description: "現在の残高を指定します。"
                      needed:
                        type: string
                        description: "必要な残高を指定します。"

  /errors/ERC20InvalidSender:
    get:
      summary: "ERC20InvalidSender"
      description: |
        無効な送信者アドレスが指定された時に返されるエラーです。

        焼却対象のアドレスがゼロアドレスの場合に発生します。

        **パラメータ:**
        - `sender` (address): 無効な送信者アドレス(通常はゼロアドレス)
      operationId: error_ERC20InvalidSender
      tags:
        - エラー
      responses:
        "200":
          description: "無効な送信者アドレスが指定された時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC20InvalidSender"
                  parameters:
                    type: object
                    properties:
                      sender:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "無効な送信者アドレスを指定します。"

