info:
  title: "ERC20Pausable Solidity Interface"
  version: "1.0.0"
  description: |
    ERC20Pausable コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、トークンの転送、鋳造、焼却を一時停止できる機能を提供するERC20の拡張です。
    評価期間が終了するまで取引を防止したり、大規模なバグが発生した際に緊急停止スイッチとして
    すべてのトークン転送を凍結したりするシナリオで有用です。

    重要: このコントラクトは、公開のpause関数とunpause関数を含みません。
    これらの機能を使用するには、AccessControlやOwnableなどの適切なアクセス制御と共に
    Pausable._pause()およびPausable._unpause()内部関数を呼び出す関数を定義する必要があります。

    このコントラクトは以下のコントラクトを継承しています:
    - ERC20
    - Pausable

