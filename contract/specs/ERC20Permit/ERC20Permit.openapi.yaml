paths:
  /permit:
    post:
      summary: "permit"
      description: |
        署名を使用してallowanceを設定します。

        この関数は、ownerが署名したメッセージを検証し、spenderに対してvalueの量のallowanceを設定します。
        EIP-2612標準に準拠した署名ベースの承認メカニズムです。
        署名の有効期限(deadline)を過ぎている場合、または署名が無効な場合はエラーになります。
      operationId: permit
      tags:
        - 書き込み関数
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンの所有者アドレスを指定します。署名の検証に使用されます。"
          example: "0x1234567890123456789012345678901234567890"
        - name: spender
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "トークンの使用を許可するアドレスを指定します。"
          example: "0x2234567890123456789012345678901234567890"
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: "承認するトークン量を指定します。uint256型の数値を文字列で表現します。"
          example: "1000000000000000000"
        - name: deadline
          in: query
          required: true
          schema:
            type: string
          description: "署名の有効期限をUNIXタイムスタンプ(秒)で指定します。この時刻を過ぎると署名は無効になります。"
          example: "1735689600"
        - name: v
          in: query
          required: true
          schema:
            type: integer
          description: "ECDSA署名のvパラメータを指定します。通常27または28の値を取ります。"
          example: 27
        - name: r
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "ECDSA署名のrパラメータ(32バイト)を16進数文字列で指定します。"
          example: "0x1234567890123456789012345678901234567890123456789012345678901234"
        - name: s
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{64}$"
          description: "ECDSA署名のsパラメータ(32バイト)を16進数文字列で指定します。"
          example: "0x1234567890123456789012345678901234567890123456789012345678901234"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "トランザクションが成功した場合、空の応答を返します。"
                    example: ""
        "500":
          description: "この関数で発生しうるエラーの一覧です。<br>・ERC2612ExpiredSignature: 署名の有効期限が切れている場合<br>・ERC2612InvalidSigner: 署名が無効またはownerと一致しない場合<br>・ERC20InvalidApprover: ownerがゼロアドレスの場合<br>・ERC20InvalidSpender: spenderがゼロアドレスの場合<br>"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ERC2612ExpiredSignature:
                  summary: 署名の有効期限切れ
                  value:
                    error: ERC2612ExpiredSignature
                    message: "ERC2612: expired deadline"
                    details: "Deadline: 1735689600, Current time: 1735690000"
                ERC2612InvalidSigner:
                  summary: 無効な署名
                  value:
                    error: ERC2612InvalidSigner
                    message: "ERC2612: invalid signer"
                    details: "Expected: 0x1234..., Got: 0x5678..."
                ERC20InvalidApprover:
                  summary: 無効なowner
                  value:
                    error: ERC20InvalidApprover
                    message: "ERC-20: approve from the zero address"
                    details: "Owner cannot be the zero address"
                ERC20InvalidSpender:
                  summary: 無効なspender
                  value:
                    error: ERC20InvalidSpender
                    message: "ERC-20: approve to the zero address"
                    details: "Spender cannot be the zero address"

  /nonces:
    get:
      summary: "nonces"
      description: |
        指定されたownerの現在のnonceを取得します。

        nonceは、permit署名のリプレイ攻撃を防ぐために使用される値です。
        各permit実行時にnonceが消費され、次のpermit呼び出しでは新しいnonceを使用する必要があります。
      operationId: nonces
      tags:
        - 読み取り関数
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
          description: "nonceを確認するアドレスを指定します。"
          example: "0x1234567890123456789012345678901234567890"
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    description: "現在のnonceを返します。"
                    example: "0"

  /DOMAIN_SEPARATOR:
    get:
      summary: "DOMAIN_SEPARATOR"
      description: |
        EIP-712ドメインセパレータを取得します。

        このハッシュ値は、EIP-712署名の作成と検証に使用されます。
        コントラクトごとに一意の値を持ち、リプレイ攻撃を防ぎます。
      operationId: DOMAIN_SEPARATOR
      tags:
        - 読み取り関数
      responses:
        "200":
          description: "正常終了時のレスポンスです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result0:
                    type: string
                    pattern: "^0x[0-9a-fA-F]{64}$"
                    description: "EIP-712ドメインセパレータのハッシュ値を返します。"
                    example: "0x1234567890123456789012345678901234567890123456789012345678901234"

  /errors/ERC2612ExpiredSignature:
    get:
      summary: "ERC2612ExpiredSignature"
      description: |
        permit署名の有効期限が切れている時に返されるエラーです。

        deadlineパラメータで指定された時刻よりも現在のブロックタイムスタンプが大きい場合に発生します。

        **パラメータ:**
        - `deadline` (uint256): 期限切れのdeadline値
      operationId: error_ERC2612ExpiredSignature
      tags:
        - エラー
      responses:
        "200":
          description: "permit署名の有効期限が切れている時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC2612ExpiredSignature"
                  parameters:
                    type: object
                    properties:
                      deadline:
                        type: string
                        description: "期限切れのdeadline値を指定します。"

  /errors/ERC2612InvalidSigner:
    get:
      summary: "ERC2612InvalidSigner"
      description: |
        permit署名が無効または一致しない時に返されるエラーです。

        署名から復元されたアドレスがownerパラメータと一致しない場合に発生します。
        署名パラメータ(v, r, s)が正しくない、または異なる秘密鍵で署名されている可能性があります。

        **パラメータ:**
        - `signer` (address): 署名から復元されたアドレス
        - `owner` (address): 期待されるownerアドレス
      operationId: error_ERC2612InvalidSigner
      tags:
        - エラー
      responses:
        "200":
          description: "permit署名が無効または一致しない時に返されるエラーです。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ERC2612InvalidSigner"
                  parameters:
                    type: object
                    properties:
                      signer:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "署名から復元されたアドレスを指定します。"
                      owner:
                        type: string
                        pattern: "^0x[0-9a-fA-F]{40}$"
                        description: "期待されるownerアドレスを指定します。"

