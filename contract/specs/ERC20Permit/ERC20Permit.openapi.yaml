info:
  title: "ERC20Permit Solidity Interface"
  version: "1.0.0"
  description: |
    ERC20Permit コントラクトの Solidity インターフェイスを OpenAPI 形式で表現した仕様です。

    このコントラクトは、署名によって承認を行うことができるERC-20 Permit拡張(EIP-2612)の実装です。
    permit関数を追加することで、アカウントのERC-20 allowanceを署名によって変更できます。
    IERC20-approveに依存しないため、トークン保有者はトランザクションを送信する必要がなく、
    Etherを保有する必要もありません。

    このコントラクトは以下のコントラクトを継承しています:
    - ERC20
    - IERC20Permit
    - EIP712
    - Nonces

